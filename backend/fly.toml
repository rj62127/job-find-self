app = "job-find-backend"
primary_region = "bom"

[build]

[env]
  DATABASE_URL = "sqlite:////data/sql_app.db"
  UPLOAD_DIR = "/data/uploads"

[mounts]
  source = "job_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
